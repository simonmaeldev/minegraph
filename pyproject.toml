[project]
name = "minegraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "cosmograph>=0.5.3",
    "jupyter>=1.1.1",
    "lxml>=6.0.2",
    "networkx[default]>=3.5",
    "nx-cugraph-cu12>=25.10.0",
    "pyfzf>=0.3.1",
    "pyqt6>=6.10.0",
    "pytest>=8.4.2",
    "requests>=2.32.5",
]

[project.scripts]
cosmosgl-viz = "src.generate_cosmosgl_html:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.uv.pip]
extra-index-url = ["https://pypi.nvidia.com"]
